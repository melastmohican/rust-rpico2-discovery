[package]
name = "rust-rpico2-discovery"
version = "0.2.0"
edition = "2024"

[dependencies]
# Cortex-M
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.1.0"


# Panic Handler
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2.7" }
rp235x-hal = { version = "0.3.0", features = [
  "binary-info",
  "critical-section-impl",
  "rt",
  "defmt",
] }
rp-binary-info = "0.1.1"
nb = "1.0.0"
micromath = "1.1.1"

[dev-dependencies]
embedded-graphics = "0.8.1"
dht20 = "0.1.0"
aht20-driver = "2.0.0"
lis3dh = "0.4.4"
ssd1306 = "0.8.4"
ssd1315 = "0.2.3"
tinybmp = "0.6.0"
bme280 = "0.5.1"
bh1750 = "0.1.0"
bmp280-ehal = "0.0.6"
vl53l4cd-ulp = "0.1.1"
libm = "0.2.11"
smart-leds = "0.3.0"
ws2812-pio = { git = "https://github.com/melastmohican/ws2812-pio-rs.git", branch = "main", features = [
  "rp235x",
], default-features = false }
mipidsi = "0.8.0"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
embedded-hal-bus = "0.2.0"
epd-spectra = "0.4.0"
epdsi = "0.1.6"
ssd1681 = "0.3.0"
format_no_std = "1.2.0"
#hs3003 = { git = "https://github.com/melastmohican/hs3003-rs", branch = "main"}
hs3003 = "0.1.1"
bosch-bme680 = "1.0.1"
sgp30 = "0.3.2"
modulino = { version = "0.3.0", features = ["defmt"] }
# modulino = { path = "../modulino-rs", features = ["defmt"] }
# modulino = { git = "https://github.com/melastmohican/modulino-rs.git", branch = "main", features = ["defmt"] }
ld2410 = "1.0.0"
scd4x = "0.4.1"
adxl345-eh-driver = "0.2.0"
max7219 = "0.3.0"
pio-proc = "0.2.0"
pio = "0.2.1"
sths34pf80 = "0.1.12"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "rp235xa",
  "critical-section-impl",
  "binary-info",
  "time-driver",
] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
cyw43 = { version = "0.7.0", features = ["defmt", "bluetooth"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.1"
portable-atomic = "1.9.0"
fixed = "1.28.0"
trouble = { package = "trouble-host", git = "https://github.com/embassy-rs/trouble.git", features = ["defmt", "scan", "central"] }
bt-hci = { version = "0.8.0", features = ["defmt", "uuid"] }
embedded-io-async = "0.7.0"
embassy-futures = { version = "0.1.0", features = ["defmt"] }
heapless = "0.8"
pmsx003 = "1.0.0"
embedded-hal-nb = "1.0"
onewire = { version = "0.4.0", features = ["defmt", "defmt-debug2format"] }
dht-sensor = { version = "0.3.0", features = ["defmt"] }

# TEMPORARY, for the SSD1677 RAM auto-fill hardware gate only. The published 0.1.6 still streams
# every RAM byte on a clear; the 0x46/0x47 pattern-generator path is committed to epdsi main but
# unreleased. Remove this and bump the dep above once epdsi 0.1.7 is out.
[patch.crates-io]
epdsi = { path = "../epdsi" }

[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
debug = false
